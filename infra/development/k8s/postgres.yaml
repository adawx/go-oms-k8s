apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: oms-db
spec:
  instances: 1
  storage:
    size: 1Gi
  monitoring:
    # CNPG exports Postgres metrics on port 9187; this makes the operator
    # create the PodMonitor that points Prometheus at them.
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: oms
      owner: app
