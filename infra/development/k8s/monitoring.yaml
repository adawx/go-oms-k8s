# Scrape configuration for the OMS services.
#
# Prometheus is configured (see the Tiltfile) to select ServiceMonitors across
# all namespaces, so these live alongside the workloads in `default` rather
# than in the monitoring namespace.
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-admin
  labels:
    app: api-gateway
    # Marks this Service as a scrape target for the OMS ServiceMonitors below.
    monitoring: oms
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: admin
      port: 9090
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-admin
  labels:
    app: order-service
    monitoring: oms
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: admin
      port: 9090
      targetPort: admin
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: oms-services
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      monitoring: oms
  endpoints:
    - port: admin
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      # Service discovery attaches its own `service` label (the Service name,
      # e.g. "api-gateway-admin"), which collides with the `service` constant
      # label the Go code sets and would be renamed to `exported_service`.
      # honorLabels keeps the value the application reports, so queries can key
      # on the workload name rather than the shim Service.
      honorLabels: true
      # Key series on the workload rather than the "<name>-admin" Service.
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_label_app]
          targetLabel: app
          action: replace
---
# Alerting and recording rules for the OMS services. Alertmanager is disabled
# in local development, so these surface as firing alerts in the Prometheus UI
# and on the Grafana dashboard rather than paging anyone.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oms-service-rules
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: oms-services
      rules:
        - alert: OMSServiceDown
          expr: up{job=~"api-gateway-admin|order-service-admin"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            # `up` is synthesised by Prometheus and carries the discovery labels,
            # so job (the admin Service name) identifies the target here -- the
            # application's own `service` label is absent from this series.
            summary: '{{ $labels.job }} is not being scraped'
            description: 'Prometheus has failed to scrape {{ $labels.job }} for over a minute.'

        - alert: OMSHighErrorRate
          # 5xx responses as a share of all responses, over a 5 minute window.
          expr: |
            sum by (service) (rate(http_requests_total{code=~"5.."}[5m]))
              /
            sum by (service) (rate(http_requests_total[5m]))
              > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.service }} is returning 5xx for over 5% of requests'

        - alert: OMSHighLatency
          # p99 latency above one second sustained for five minutes.
          expr: |
            histogram_quantile(
              0.99,
              sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
            ) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.service }} p99 latency is above 1s'
