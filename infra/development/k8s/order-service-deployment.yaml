apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: go-oms/order-service
          ports:
            - name: http
              containerPort: 8085
            - name: admin
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            # Readiness checks the database, so the pod leaves the Service
            # endpoints whenever Postgres is unreachable.
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: '64Mi'
              cpu: '100m'
            limits:
              memory: '128Mi'
              cpu: '200m'
          env:
            - name: ADMIN_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  key: ADMIN_HTTP_ADDR
                  name: app-config
            # DB_HOST points at the CNPG read/write Service (the primary).
            - name: DB_HOST
              value: oms-db-rw
            - name: DB_PORT
              value: '5432'
            # Credentials come from the secret CNPG auto-generated for the app user.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: oms-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oms-db-app
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: oms-db-app
                  key: dbname
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 8085
      name: http
      targetPort: 8085
  type: ClusterIP
