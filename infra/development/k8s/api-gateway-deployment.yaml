apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: go-oms/api-gateway
          ports:
            - name: http
              containerPort: 8081
            # Metrics and health probes are served on a separate port so they
            # are not reachable through the public LoadBalancer Service.
            - name: admin
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: '128Mi'
              cpu: '125m'
            limits:
              memory: '128Mi'
              cpu: '125m'
          env:
            # The service reads HTTP_ADDR; the config map names the key
            # GATEWAY_HTTP_ADDR so each service can carry its own listen
            # address in the shared map.
            - name: HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  key: GATEWAY_HTTP_ADDR
                  name: app-config
            - name: ADMIN_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  key: ADMIN_HTTP_ADDR
                  name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: LoadBalancer
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: api-gateway
